; ─────────────────────────────────────────────────────────────────
; esp32_firmware/platformio.ini  —  Configuración de PlatformIO
;
; Descripción:
;   Fichero de configuración para compilar y flashear el firmware
;   del nodo ESP32 usando PlatformIO (VS Code o CLI).
;
; Instalación de PlatformIO:
;   pip install platformio
;
; Compilar y flashear:
;   cd esp32_firmware
;   pio run --target upload
;
; Monitor serie:
;   pio device monitor --baud 115200
; ─────────────────────────────────────────────────────────────────

[env:esp32dev]
; Plataforma: Espressif ESP32 con framework Arduino
platform  = espressif32
board     = esp32dev
framework = arduino

; Velocidad del monitor serie (debe coincidir con BAUD_RATE en main.cpp)
monitor_speed = 115200

; Puerto serie (ajustar según el sistema operativo):
;   Linux:   /dev/ttyUSB0  o  /dev/ttyACM0
;   macOS:   /dev/cu.usbserial-XXXX
;   Windows: COM3, COM4...
; upload_port = /dev/ttyUSB0

; Opciones de compilación: nivel de optimización para tamaño
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Os

; Dependencias de bibliotecas (para versión futura con pantalla LCD)
; lib_deps =
;     ArduinoJson@^6.21.0
;     adafruit/Adafruit GFX Library@^1.11.9
